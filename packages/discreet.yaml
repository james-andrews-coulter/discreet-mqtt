      unique_id: discreet_steam_switch
      command_topic: "discreet/cmd/steam"
      state_topic: "discreet/telemetry"
      value_template: "{{ 'ON' if value_json.steam else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
