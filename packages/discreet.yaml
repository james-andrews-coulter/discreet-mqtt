# ---------------------------------------------------------------------
# Formatted shot timer (mm:ss) for display - source of truth is the
# raw sensor.discreet_shot_time (firmware actime field).
# ---------------------------------------------------------------------
template:
  - sensor:
      - name: "Discreet Shot Timer"
        unique_id: discreet_shot_timer
        state: "{{ '%02d:%02d' | format((states('sensor.discreet_shot_time') | int(0)) // 60, (states('sensor.discreet_shot_time') | int(0)) % 60) }}"
        icon: mdi:timer-outline
        availability: "{{ states('sensor.discreet_shot_time') not in ['unknown', 'unavailable'] }}"

      - name: "Discreet Total Shots"
        unique_id: discreet_total_shots
        state: "{{ states('counter.discreet_lifetime_shots') }}"
        unit_of_measurement: "shots"
        state_class: total_increasing
        icon: mdi:coffee-outline
        availability: "{{ states('counter.discreet_lifetime_shots') not in ['unknown', 'unavailable'] }}"

# ---------------------------------------------------------------------
# Lifetime shot counter.
# Backfilled from recorder history: 26 shots since MQTT telemetry began
# (2026-08-17: 14, 2026-08-18: 12). The automation increments it on every
# shot start (sensor.discreet_shot_state leaves idle -> preinfusion /
# extraction / bloom). restore: true (default) keeps the count across HA
# restarts; initial only applies at first creation.
# ---------------------------------------------------------------------
counter:
  discreet_lifetime_shots:
    name: "Discreet Lifetime Shots"
    icon: mdi:coffee-outline
    initial: 26
    step: 1

automation:
  - id: discreet_count_shot
    alias: "Discreet: count each shot"
    trigger:
      - platform: state
        entity_id: sensor.discreet_shot_state
        to: ["preinfusion", "extraction", "bloom"]
        from: ["idle", "unknown", "unavailable"]
    # Steam-release flush (steam valve + group head open after frothing)
    # also drives shotstate -> would over-count. Gate on steam OFF.
    # ponytail: duration/weight gate if a steam-OFF flush ever appears.
    condition:
      - condition: state
        entity_id: binary_sensor.discreet_steam_mode
        state: "off"
    action:
      - service: counter.increment
        target:
          entity_id: counter.discreet_lifetime_shots
    mode: single
