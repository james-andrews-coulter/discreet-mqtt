      mode: slider
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Pre-infusion Time"
      unique_id: discreet_preinf_time
      command_topic: "discreet/cmd/preinftime"
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.preinftime }}"
      min: 0
      max: 20
      step: 1
      unit_of_measurement: "s"
      mode: slider
      availability_topic: "discreet/status"
