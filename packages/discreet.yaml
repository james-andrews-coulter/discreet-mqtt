      payload_not_available: "offline"

    - name: "Discreet Bloom Time"
      unique_id: discreet_bloom_time
      command_topic: "discreet/cmd/bloomtime"
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.bloomtime }}"
      min: 0
