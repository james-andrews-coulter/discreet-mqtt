# Discreet package: drop into <ha-config>/packages/discreet.yaml, restart HA. Requires Mosquitto + MQTT integration + 'homeassistant: {packages: !include_dir_named packages}' in configuration.yaml.
# =====================================================================
# Discreet espresso controller -> Home Assistant (MQTT bridge)
# Repo: https://github.com/james-andrews-coulter/discreet-mqtt
# Firmware: Discreet_MQTT/Discreet_MQTT.ino (flashed over ArduinoOTA)
# Broker:   mosquitto (see .mqtt_creds.example for the flash-script creds file)
# Topics:   discreet/telemetry (1 Hz JSON)  discreet/status (LWT)
#           discreet/cmd/{setpoint,pressuresetpoint,preinftime,bloomtime,steam,pause}
# Design:   mirrors the original discreet.local web UI + brew-by-weight
# =====================================================================
mqtt:
  sensor:
    - name: "Discreet Boiler Temp"
      unique_id: discreet_boiler_temp
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.temp }}"
      unit_of_measurement: "°C"
      device_class: temperature
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Target Temp"
      unique_id: discreet_target_temp
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.setpoint }}"
      unit_of_measurement: "°C"
      device_class: temperature
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Pressure"
      unique_id: discreet_pressure
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.pressure }}"
      unit_of_measurement: "bar"
      device_class: pressure
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Pump Power"
      unique_id: discreet_pump_power
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.pumppower }}"
      unit_of_measurement: "%"
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Shot Time"
      unique_id: discreet_shot_time
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.actime }}"
      unit_of_measurement: "s"
      icon: mdi:timer-outline
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Shot State"
      unique_id: discreet_shot_state
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.shotstate }}"
      icon: mdi:coffee
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    # --- brew-by-weight ---
    - name: "Discreet Scale Weight"
      unique_id: discreet_scale_weight
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.weight }}"
      unit_of_measurement: "g"
      device_class: weight
      state_class: measurement
      icon: mdi:scale
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Shot Weight"
      unique_id: discreet_shot_weight
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.shotweight }}"
      unit_of_measurement: "g"
      device_class: weight
      state_class: measurement
      icon: mdi:coffee-to-go
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Flow Rate"
      unique_id: discreet_flow_rate
      state_topic: "discreet/telemetry"
      value_template: "{{ value_json.flowrate }}"
      unit_of_measurement: "g/s"
      state_class: measurement
      icon: mdi:water-outline
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

  binary_sensor:
    - name: "Discreet Steam Mode"
      unique_id: discreet_steam_mode
      state_topic: "discreet/telemetry"
      value_template: "{{ 'ON' if value_json.steam else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: heat
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    # --- brew-by-weight ---
    - name: "Discreet Scale Connected"
      unique_id: discreet_scale_connected
      state_topic: "discreet/telemetry"
      value_template: "{{ 'ON' if value_json.scale == 'connected' else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: connectivity
      icon: mdi:bluetooth
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet BBW Armed"
      unique_id: discreet_bbw_armed
      state_topic: "discreet/telemetry"
      value_template: "{{ 'ON' if value_json.bbwarmed else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:target
      availability_topic: "discreet/status"
      payload_available: "online"
      payload_not_available: "offline"

    - name: "Discreet Scale Stable"
      unique_id: discreet_scale_stable
      state_topic: "discreet/telemetry"
      value_template: "{{ 'ON' if value_json.scalestable else 'OFF' }}"
      payload_on: "ON"
      payload_off: "OFF"
      icon: mdi:scale-balance
      availability_topic: "discreet/status"
